server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # DNS resolver for dynamic upstream resolution (prevents 502 on DNS changes)
    resolver 8.8.8.8 valid=30s ipv6=off;

    # Increase timeouts for Render's cold start (free tier spins down)
    proxy_connect_timeout 120s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # Proxy API requests to backend
    location /api/ {
        set $backend "https://backend-wdov.onrender.com";
        proxy_pass $backend;
        proxy_set_header Host backend-wdov.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
    }

    # Proxy SSE events (no buffering, no timeout for streaming)
    location /api/events/ {
        set $backend_events "https://backend-wdov.onrender.com";
        proxy_pass $backend_events;
        proxy_set_header Host backend-wdov.onrender.com;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_read_timeout 86400s;
    }

    # SPA fallback — all routes served by index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
