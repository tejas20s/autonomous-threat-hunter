services:
  # ── Database ───────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: soc-postgres
    environment:
      POSTGRES_DB: insider_threat
      POSTGRES_USER: soc_user
      POSTGRES_PASSWORD: soc_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soc_user -d insider_threat"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Pipeline (runs once to generate data, then exits) ──────────────
  pipeline:
    build:
      context: ./backend
      dockerfile: Dockerfile.pipeline
    container_name: soc-pipeline
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://soc_user:soc_password@postgres:5432/insider_threat
    volumes:
      - pipeline_data:/app/app/data
      - pipeline_output:/app/output

  # ── Backend API ────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: soc-backend
    depends_on:
      postgres:
        condition: service_healthy
      pipeline:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+asyncpg://soc_user:soc_password@postgres:5432/insider_threat
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
    volumes:
      - pipeline_output:/app/output
      - ./backend/.env:/app/.env:ro
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── Dashboard (React + Nginx) ──────────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: soc-dashboard
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  postgres_data:
  pipeline_data:
  pipeline_output:
